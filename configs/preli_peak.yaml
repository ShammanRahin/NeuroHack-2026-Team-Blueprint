base: preli_nogpu
name: preli_peak
note: 'ablation peak (variant 10): tf-idf + handcrafted + obfuscation + Banglish e5 + trilingual label descriptions; normaliser v2; label-structure decoder'
features:
- name: tfidf_char
  params:
    ngram:
    - 2
    - 5
    max_features: 200000
- name: tfidf_word
  params:
    max_features: 50000
- name: handcrafted
  params:
    weight: 1.0
- name: obfusc
  params:
    weight: 1.0
- name: sbert
  params:
    model: kazalbrur/bangla-embed-e5-small-banglish
    prefix: 'query: '
- name: labeldesc
  params:
    model: kazalbrur/bangla-embed-e5-small-banglish
    prefix: 'query: '
data:
  normalize: 2
decode:
  tech_prior_weight: 0.5
  action_prior_weight: 0.3
  priority_tau: 0.8
  conf_post: true
  conf_shrink: 0.8
  noise_router: true
