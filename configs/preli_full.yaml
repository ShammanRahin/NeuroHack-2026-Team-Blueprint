base: preli_nogpu
name: preli_full
note: GPU - tf-idf + handcrafted + multilingual-e5 embeddings + label-description similarity + zero-shot NLI scores
features:
  - {name: tfidf_char, params: {ngram: [2, 5], max_features: 200000}}
  - {name: tfidf_word, params: {max_features: 50000}}
  - {name: handcrafted, params: {weight: 1.0}}
  - {name: sbert, params: {model: intfloat/multilingual-e5-small, prefix: "query: ", weight: 1.0}}
  - {name: labeldesc, params: {model: intfloat/multilingual-e5-small, prefix: "query: ", weight: 1.0}}
  - {name: nli, params: {model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7, max_length: 128, weight: 1.0}}
