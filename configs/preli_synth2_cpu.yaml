base: preli_nogpu
name: preli_synth2_cpu
note: CPU - char+word tf-idf + handcrafted + obfuscation, normaliser v2, label-structure decoder + 120k synthetic (round 2: compositional + code-mixed) labelled messages
features:
  - {name: tfidf_char, params: {ngram: [2, 5], max_features: 200000}}
  - {name: tfidf_word, params: {max_features: 50000}}
  - {name: handcrafted, params: {weight: 1.0}}
  - {name: obfusc, params: {weight: 1.0}}
data:
  normalize: 2
  synthetic: {n: 120000, seed: 11}
augment: {copies: 1, strength: 0.06, noise_rows: 300, translit: true, views: true, robust_eval: true}
decode: {tech_prior_weight: 0.5, action_prior_weight: 0.3, conf_post: true, noise_router: true}
skip_cv: true
